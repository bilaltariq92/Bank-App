<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank App</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">
    <style>
        body {
            background-color: #E6E6FA; 
        }
        button{
            background-color: #e4a0f7;
            color: #d21404 ;
        }
        p{
         color: #79baec;
        }
    
    </style>
</head>
<body>
   <div id="container">
    <form id="bankForm">
        <label for="transaction">transaction</label>
        <input
        type="number"
        id="transaction" required
        minlength="100"
        maxlength="6000"
        placeholder="Enter Your Amount"
        >
        <br>

        <label for="EventName">Purpose Of Debit</label>
        <select id="Debit" required>
            <option value="gaining" style="color: darkred;">Gaining</option>
            <option value="spending" style="color: hotpink;">Spending</option>
            <option value="receiving" style="color: darkmagenta;">Receiving</option>
            <option value="Paying" style="color: darkorchid;">Paying</option>
        </select>
        <br>
        
        <label for="EventName">Source Of Credit</label>
        <select id="credit" required>
            <option value="earning" style="color: dodgerblue;">Earning</option>
            <option value="funding" style="color: darkgreen;">Funding</option>
            <option value="lending" style="color: darkgoldenrod;">Lending</option>
            <option value="owing" style="color: gold;">Owing</option>
        </select>

  </div>
  <button class="credit">Credit</button>
  <p>Or</p>
<button class="debit">Debit</button>
<p>Your Walllet:900rs</p>
<p id="note">Terms And Conditions Apply</p>
</body>
</html>
